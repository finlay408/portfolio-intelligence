# The test suite is the gate on every displayed number, so it runs on every
# push. None of it needs a database: the engine is a pure function of its
# inputs, which is what makes the golden portfolio assertable by hand.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # The build must not require a live database.
          SKIP_ENV_VALIDATION: '1'

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r analytics/requirements.txt
      - name: Import check
        run: |
          cd analytics
          python -c "import db, risk, var, factors, rrg, scenarios, liquidity, structure, run_nightly; print('analytics modules import cleanly')"
      - name: Analytics tests
        run: python analytics/test_analytics.py
